name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Coherencia de versiones (los 4 sitios)
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/check-versions.mjs

      - name: Instalar Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Tests de los validadores
        run: npm test

      - name: Regresión de style packs (smoke-test)
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node scripts/smoke-test.mjs

      - name: Generar deck de humo para audit/check-reveal
        run: |
          cp template.html /tmp/ci-deck-raw.html
          node scripts/apply-style-pack.mjs styles/paper-white.md /tmp/ci-deck-raw.html /tmp/ci-deck.html
          node -e "
            const fs = require('node:fs');
            const p = '/tmp/ci-deck.html';
            const html = fs.readFileSync(p, 'utf8').replace('Slizdeck · [DECK NAME]', 'CI Smoke Deck');
            fs.writeFileSync(p, html);
          "

      - name: audit.mjs sobre el deck de humo
        run: node scripts/audit.mjs /tmp/ci-deck.html

      - name: check-reveal.mjs sobre el deck de humo
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node scripts/check-reveal.mjs /tmp/ci-deck.html

      - name: check-overflow.mjs sobre el deck de humo
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node scripts/check-overflow.mjs /tmp/ci-deck.html

      - name: Validar examples/pitch-showcase.html (el ejemplo propio)
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          node scripts/audit.mjs examples/pitch-showcase.html
          node scripts/check-contrast.mjs examples/pitch-showcase.html
          node scripts/check-reveal.mjs examples/pitch-showcase.html
          node scripts/check-overflow.mjs examples/pitch-showcase.html
          node scripts/doctor.mjs examples/pitch-showcase.html
          node scripts/shoot.mjs examples/pitch-showcase.html --slides=1 --out=/tmp/ci-shots

      - name: export-pptx.mjs y make-offline.mjs (cobertura del export)
        run: |
          node scripts/export-pptx.mjs examples/pitch-showcase.html /tmp/ci-deck.pptx
          test -s /tmp/ci-deck.pptx || { echo "el .pptx salio vacio"; exit 1; }
          cp examples/pitch-showcase.html /tmp/ci-offline.html
          node scripts/make-offline.mjs /tmp/ci-offline.html
          grep -q "data:font/woff2;base64," /tmp/ci-offline.html || { echo "make-offline no incrusto ninguna fuente"; exit 1; }

      - name: renumber.mjs es idempotente sobre un deck ya ordenado
        run: |
          cp examples/pitch-showcase.html /tmp/ci-renum.html
          node scripts/renumber.mjs /tmp/ci-renum.html
          diff -q examples/pitch-showcase.html /tmp/ci-renum.html || { echo "renumber modifico un deck que ya estaba en orden"; exit 1; }

      - name: audit.mjs sobre el ejemplo heredado (no bloqueante)
        if: always()
        run: |
          node scripts/audit.mjs examples/demo-deck.html || \
            echo "::warning::examples/demo-deck.html falla contraste por diseño — es el ejemplo heredado del fork original, ver NOTICE.md. No bloquea el CI."
