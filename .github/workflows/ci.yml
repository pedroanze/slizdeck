name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Coherencia de versiones (los 6 sitios)
        run: node scripts/check-versions.mjs

      - name: Instalar Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: CHROME_PATH para todos los pasos
        run: echo "CHROME_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Coherencia docs ↔ repo
        run: node scripts/check-docs.mjs

      - name: Tests de los validadores
        run: npm test

      - name: Regresión de style packs (smoke-test)
        run: node scripts/smoke-test.mjs

      - name: Deck nuevo desde el template (el camino de la fase build)
        run: |
          node bin/slizdeck.mjs new /tmp/ci-deck.html --pack=paper-white
          sed -i 's/Slizdeck · \[DECK NAME\]/CI Smoke Deck/' /tmp/ci-deck.html
          node bin/slizdeck.mjs check /tmp/ci-deck.html

      - name: Validar examples/pitch-showcase.html (el ejemplo propio)
        run: |
          node scripts/audit.mjs examples/pitch-showcase.html
          node scripts/check-contrast.mjs examples/pitch-showcase.html
          node scripts/check-reveal.mjs examples/pitch-showcase.html
          node scripts/check-overflow.mjs examples/pitch-showcase.html
          node scripts/doctor.mjs examples/pitch-showcase.html
          node scripts/shoot.mjs examples/pitch-showcase.html --slides=1 --out=/tmp/ci-shots

      - name: Validar examples/datos-showcase.html (patrones de datos, en los 5 packs)
        run: |
          node scripts/audit.mjs examples/datos-showcase.html
          node scripts/check-reveal.mjs examples/datos-showcase.html
          node scripts/check-overflow.mjs examples/datos-showcase.html
          for p in terminal paper-white committed instrument editorial; do
            node scripts/apply-style-pack.mjs "styles/$p.md" examples/datos-showcase.html "/tmp/ci-datos-$p.html"
            node scripts/check-contrast.mjs "/tmp/ci-datos-$p.html"
          done
          node scripts/export-pptx.mjs examples/datos-showcase.html /tmp/ci-datos.pptx
          node scripts/export-pptx.mjs examples/datos-showcase.html /tmp/ci-datos-native.pptx --charts=native
          node scripts/export-pdf.mjs examples/datos-showcase.html /tmp/ci-datos.pdf
          node scripts/score-deck.mjs examples/datos-showcase.html --no-chrome

      - name: Los validadores terminan aunque Chrome no entregue ningun frame
        run: |
          # En Linux sin GPU a veces el primer requestAnimationFrame no llega:
          # los harness tienen que arrancar igual (temporizador de respaldo).
          sed 's#<head>#<head><script>window.requestAnimationFrame=function(){return 0};</script>#' \
            examples/datos-showcase.html > /tmp/ci-noraf.html
          node scripts/check-contrast.mjs /tmp/ci-noraf.html
          node scripts/check-reveal.mjs /tmp/ci-noraf.html
          node scripts/check-overflow.mjs /tmp/ci-noraf.html

      - name: export-pptx.mjs, export-pdf.mjs y make-offline.mjs (cobertura del export)
        run: |
          # Por geometria: los tres decks de prueba (que el exportador por
          # clases perdia 30/116/100 textos) tienen que exportar sin perdidas.
          for d in examples/test-0*/*.html; do
            node scripts/export-pptx.mjs "$d" "/tmp/ci-$(basename "$d" .html).pptx"
            node scripts/export-pdf.mjs "$d" "/tmp/ci-$(basename "$d" .html).pdf"
          done
          node scripts/export-pptx.mjs examples/pitch-showcase.html /tmp/ci-deck.pptx
          test -s /tmp/ci-deck.pptx || { echo "el .pptx salio vacio"; exit 1; }
          cp examples/pitch-showcase.html /tmp/ci-offline.html
          node scripts/make-offline.mjs /tmp/ci-offline.html
          grep -q "data:font/woff2;base64," /tmp/ci-offline.html || { echo "make-offline no incrusto ninguna fuente"; exit 1; }

      - name: renumber.mjs es idempotente sobre un deck ya ordenado
        run: |
          cp examples/pitch-showcase.html /tmp/ci-renum.html
          node scripts/renumber.mjs /tmp/ci-renum.html
          diff -q examples/pitch-showcase.html /tmp/ci-renum.html || { echo "renumber modifico un deck que ya estaba en orden"; exit 1; }

      - name: Paquete npm e instalación con npx (tarball real)
        run: |
          # npm pack imprime el nombre del tarball en la ultima linea. Guardarlo
          # en una variable: un glob pegado a --package= no lo expande la shell.
          TGZ="/tmp/$(npm pack --pack-destination /tmp | tail -1)"
          SIZE=$(stat -c %s "$TGZ")
          echo "tarball: $SIZE bytes"
          test "$SIZE" -lt 1000000 || { echo "el paquete pesa mas de 1 MB: revisar 'files' en package.json"; exit 1; }
          export SLIZDECK_HOME=$(mktemp -d)
          cd "$SLIZDECK_HOME"
          npx -y --package="$TGZ" slizdeck install --agent all
          for a in claude codex gemini opencode; do test -f "$SLIZDECK_HOME/.$a/skills/slizdeck/SKILL.md"; done
          node "$SLIZDECK_HOME/.claude/skills/slizdeck/scripts/export-pptx.mjs" \
            "$SLIZDECK_HOME/.claude/skills/slizdeck/examples/pitch-showcase.html" /tmp/ci-npx.pptx

