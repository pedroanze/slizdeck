name: Release

# Al hacer push de un tag vX.Y.Z: verifica, publica a npm y crea el Release.
# Autenticacion: trusted publishing (npmjs.com → slizdeck → Settings →
# Trusted publisher → GitHub Actions, workflow release.yml) o, mientras no
# este configurado, el secret NPM_TOKEN (token granular con permiso de
# publicar y "bypass 2FA").

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # crear el GitHub Release
  id-token: write   # npm publish --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # npm 11.5.1+ publica con trusted publishing (OIDC) si el paquete lo
      # tiene configurado en npmjs.com, sin token; si no, usa NPM_TOKEN.
      # Fijado a la linea 11: npm@latest (12+) exige Node 22 y este job
      # corre en Node 20, el minimo que soporta la skill.
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      - name: El tag coincide con los 6 sitios de versión
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/check-versions.mjs

      - name: Docs y tests
        run: node scripts/check-docs.mjs && npm test

      - name: Publicar a npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Crear el Release con la entrada del CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## $VERSION" '$0==v{on=1;next} /^## [0-9]/{if(on)exit} on' CHANGELOG.md > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
