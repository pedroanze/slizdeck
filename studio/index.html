<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slizdeck Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Cstyle%3Epath%7Bfill%3A%230a0b0c%7D%40media(prefers-color-scheme%3Adark)%7Bpath%7Bfill%3A%23f2f3f4%7D%7D%3C%2Fstyle%3E%3Cpath%20fill-rule%3D%27evenodd%27%20d%3D%27M15%200H49a15%2015%200%200%201%2015%2015V49a15%2015%200%200%201-15%2015H15a15%2015%200%200%201-15-15V15a15%2015%200%200%201%2015-15zM43%2014L17%2014L17%2028.52L39%2040.28L39%2042L21%2042L21%2050L47%2050L47%2035.48L25%2023.72L25%2022L43%2022z%27%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="/__studio/editor.css">
</head>
<body>
<header class="bar">
  <div class="brand"><svg class="mark" viewBox="0 0 97 64" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M22 1H85a11 11 0 0 1 11 11V42a3 3 0 0 1-6 0V12a5 5 0 0 0-5-5H22a3 3 0 0 1 0-6zM10 14H74a8 8 0 0 1 8 8V54a8 8 0 0 1-8 8H10a8 8 0 0 1-8-8V22a8 8 0 0 1 8-8zM51.5 22.75L29.25 22.75L29.25 34.91L48.25 44.99L48.25 46.75L32.5 46.75L32.5 53.25L54.75 53.25L54.75 41.09L35.75 31.01L35.75 29.25L51.5 29.25z"/></svg><strong>Slizdeck</strong><span class="sub">Studio</span><span class="file" id="file-name"></span></div>
  <div class="status" id="status" aria-live="polite">Cargando</div>
  <div class="bar-actions">
    <button type="button" class="btn icon" id="btn-undo" title="Deshacer (⌘Z)" aria-label="Deshacer" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3 2.5 6.5 6 10M3 6.5h6.5a3.5 3.5 0 0 1 0 7H7"/></svg>
    </button>
    <button type="button" class="btn icon" id="btn-redo" title="Rehacer (⇧⌘Z)" aria-label="Rehacer" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3l3.5 3.5L10 10M13 6.5H6.5a3.5 3.5 0 0 0 0 7H9"/></svg>
    </button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" class="btn" id="btn-check" title="Corre audit y check-overflow sobre el deck guardado">Revisar</button>
    <button type="button" class="btn" id="btn-preview" title="Abre el deck con sus animaciones en otra pestaña">Vista previa</button>
    <button type="button" class="btn primary" id="btn-send" disabled>Enviar al agente</button>
  </div>
</header>

<main class="work">
  <nav class="rail" id="rail" aria-label="Slides"></nav>

  <section class="stage" id="stage">
    <div class="canvas" id="canvas">
      <iframe id="frame" title="Deck" tabindex="-1"></iframe>
      <div class="overlay" id="overlay">
        <div class="hover-box" id="hover-box" hidden></div>
        <div class="guides" id="guides"></div>
        <div class="sel-box" id="sel-box" hidden>
          <span class="sel-label" id="sel-label"></span>
          <i class="h nw" data-h="nw"></i><i class="h ne" data-h="ne"></i>
          <i class="h se" data-h="se"></i><i class="h sw" data-h="sw"></i>
          <i class="h e" data-h="e"></i><i class="h w" data-h="w"></i><i class="h s" data-h="s"></i>
        </div>
      </div>
    </div>
    <p class="hint" id="hint">Clic para seleccionar · doble clic para editar texto · arrastra para mover · Esc sube al contenedor</p>
  </section>

  <aside class="panel" id="panel" aria-label="Propiedades"></aside>
</main>

<div class="drawer" id="drawer" hidden>
  <div class="drawer-head"><strong>Revisión del deck</strong><button type="button" class="btn icon" id="drawer-close" aria-label="Cerrar">×</button></div>
  <div class="drawer-body" id="drawer-body"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="file-input" accept="image/png,image/jpeg,image/gif,image/webp,image/avif,image/svg+xml" hidden>
<script src="/__studio/editor.js"></script>
</body>
</html>
